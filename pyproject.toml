[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-systems-chatbot-ui"
version = "0.1.0"
description = "Streamlit-based Chat UI for AgenticSystems"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "python-multipart>=0.0.5",
    "httpx>=0.23.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=0.19.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "qdrant-client>=1.1.0",
    "langsmith>=0.0.1",
    "instructor>=0.1.0",
    "streamlit>=1.0.0",
    "watchdog>=2.0.0",
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=0.1.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.25.0"
]
